services:
  backend:
    build:
      context: ./Backend/Backend
      dockerfile: Dockerfile
    container_name: programming-tech-assist-backend
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - Jwt__SecretKey=${JWT_SECRET_KEY:?Set JWT_SECRET_KEY before starting the stack}
      - Jwt__Issuer=ProgrammingTechAssistAPI
      - Jwt__Audience=ProgrammingTechAssistClient
    volumes:
      - backend-data:/app/Data
    restart: unless-stopped

  frontend:
    build:
      context: ./Frontend/techroad-client
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:5000/api
    container_name: programming-tech-assist-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend-data:
